name: Build VocabKing Android APK

on:
  push:
    branches: [ android-vocabking-v1.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restore 2000-word vocabulary
        working-directory: android-vocabking
        run: |
          mkdir -p app/src/main/assets
          cat vocab/chunk1.b64 vocab/chunk2.b64 vocab/chunk3.b64 | base64 --decode | gzip --decompress > app/src/main/assets/vocabulary.json
          python3 - <<'PY'
          import json
          data=json.load(open('app/src/main/assets/vocabulary.json',encoding='utf-8'))
          assert len(data)==2000, len(data)
          print('Vocabulary entries:',len(data))
          PY

      - name: Install Gradle 8.7
        working-directory: android-vocabking
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Build APK
        working-directory: android-vocabking
        run: ./gradle-8.7/bin/gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VocabKing-Android-v1.2
          path: android-vocabking/app/build/outputs/apk/debug/app-debug.apk
